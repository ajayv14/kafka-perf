startDelaySeconds: 0
lowercaseOutputName: true
lowercaseOutputLabelNames: true

# MINIMAL CONFIG - Only essential metrics to prevent CPU spikes during scraping
rules:

# =====================================================
# THROUGHPUT - Bytes In/Out (Essential)
# =====================================================

# Bytes In - Total only (no per-topic)
- pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>Count'
  name: kafka_broker_bytes_in_total
  type: COUNTER
  help: "Total bytes received"

# Bytes Out - Total only (no per-topic)
- pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>Count'
  name: kafka_broker_bytes_out_total
  type: COUNTER
  help: "Total bytes sent"

# =====================================================
# MESSAGE COUNTS (Essential)
# =====================================================

- pattern: 'kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><>Count'
  name: kafka_broker_messages_in_total
  type: COUNTER
  help: "Total messages received by broker"

# =====================================================
# BROKER HEALTH (Essential)
# =====================================================

- pattern: 'kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value'
  name: kafka_under_replicated_partitions
  type: GAUGE
  help: "Number of under-replicated partitions"

- pattern: 'kafka.server<type=ReplicaManager, name=PartitionCount><>Value'
  name: kafka_partition_count
  type: GAUGE
  help: "Number of partitions on this broker"

- pattern: 'kafka.server<type=ReplicaManager, name=LeaderCount><>Value'
  name: kafka_leader_count
  type: GAUGE
  help: "Number of leader replicas on this broker"

- pattern: 'kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value'
  name: kafka_active_controller
  type: GAUGE
  help: "Indicates if this broker is the active controller"

# =====================================================
# JVM HEAP & MEMORY (Basic only)
# =====================================================

- pattern: 'java.lang<type=Memory><HeapMemoryUsage>used'
  name: jvm_heap_used_bytes
  type: GAUGE
  help: "JVM heap memory used"


- pattern: 'java.lang<type=Memory><NonHeapMemoryUsage>used'
  name: jvm_non_heap_used_bytes
  type: GAUGE
  help: "JVM non-heap memory used"

# =====================================================
# CPU & THREADING
# =====================================================

# Process CPU Load
- pattern: 'java.lang<type=OperatingSystem><>ProcessCpuLoad'
  name: jvm_process_cpu_load_ratio
  type: GAUGE
  help: "Recent CPU usage for the JVM process (0.0-1.0)"

# System CPU Load
- pattern: 'java.lang<type=OperatingSystem><>SystemCpuLoad'
  name: jvm_system_cpu_load_ratio
  type: GAUGE
  help: "Recent CPU usage for the whole system (0.0-1.0)"

# Thread Count
- pattern: 'java.lang<type=Threading><>ThreadCount'
  name: kafka_jvm_threads_current
  type: GAUGE
  help: "Current thread count"

# Heap Memory Max
- pattern: 'java.lang<type=Memory><HeapMemoryUsage>max'
  name: jvm_heap_max_bytes
  type: GAUGE
  help: "JVM heap memory maximum"

# =====================================================
# REQUEST LATENCY (Minimal - only p99)
# =====================================================

- pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=Produce><>99thPercentile'
  name: kafka_request_produce_latency_p99_ms
  type: GAUGE
  help: "Produce request latency p99"

