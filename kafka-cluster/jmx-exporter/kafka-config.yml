---
# JMX Exporter configuration for Kafka CPU and performance metrics
# Place at: ./jmx-exporter/kafka-config.yml

lowercaseOutputName: true
lowercaseOutputLabelNames: true

# Whitelist of MBeans to export (CPU-focused for research)
whitelistObjectNames:
  - java.lang:type=OperatingSystem
  - java.lang:type=Threading
  - java.lang:type=Memory
  - java.lang:type=GarbageCollector,name=*
  - kafka.server:type=BrokerTopicMetrics,name=*
  - kafka.server:type=ReplicaManager,name=*
  - kafka.network:type=RequestMetrics,name=*
  - kafka.server:type=KafkaRequestHandlerPool,name=*

rules:
  # ==========================================
  # CPU METRICS (Primary focus for research)
  # ==========================================
  
  # Process CPU usage
  - pattern: 'java.lang<type=OperatingSystem><>ProcessCpuLoad'
    name: kafka_process_cpu_usage_percent
    type: GAUGE
    help: "Process CPU usage as a percentage (0.0 to 1.0)"

  # System CPU usage
  - pattern: 'java.lang<type=OperatingSystem><>SystemCpuLoad'
    name: kafka_system_cpu_usage_percent
    type: GAUGE
    help: "System-wide CPU usage as a percentage (0.0 to 1.0)"

  # Process CPU time (cumulative)
  - pattern: 'java.lang<type=OperatingSystem><>ProcessCpuTime'
    name: kafka_process_cpu_time_nanoseconds
    type: COUNTER
    help: "Process CPU time in nanoseconds"

  # Available processors
  - pattern: 'java.lang<type=OperatingSystem><>AvailableProcessors'
    name: kafka_available_processors
    type: GAUGE
    help: "Number of processors available to the JVM"

  # System load average
  - pattern: 'java.lang<type=OperatingSystem><>SystemLoadAverage'
    name: kafka_system_load_average
    type: GAUGE
    help: "System load average for the last minute"

  # ==========================================
  # THREAD METRICS (CPU scheduling impact)
  # ==========================================
  
  # Thread count
  - pattern: 'java.lang<type=Threading><>ThreadCount'
    name: kafka_thread_count
    type: GAUGE
    help: "Current number of live threads"

  # Peak thread count
  - pattern: 'java.lang<type=Threading><>PeakThreadCount'
    name: kafka_thread_peak_count
    type: GAUGE
    help: "Peak live thread count since JVM start"

  # Total started threads
  - pattern: 'java.lang<type=Threading><>TotalStartedThreadCount'
    name: kafka_thread_total_started
    type: COUNTER
    help: "Total number of threads created and started since JVM start"

  # Daemon thread count
  - pattern: 'java.lang<type=Threading><>DaemonThreadCount'
    name: kafka_thread_daemon_count
    type: GAUGE
    help: "Current number of live daemon threads"

  # ==========================================
  # MEMORY METRICS (GC impacts CPU)
  # ==========================================
  
  # Heap memory usage
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>(\w+)'
    name: kafka_memory_heap_$1_bytes
    type: GAUGE
    help: "Heap memory usage in bytes"

  # Non-heap memory usage
  - pattern: 'java.lang<type=Memory><NonHeapMemoryUsage>(\w+)'
    name: kafka_memory_nonheap_$1_bytes
    type: GAUGE
    help: "Non-heap memory usage in bytes"

  # ==========================================
  # GC METRICS (GC pauses consume CPU)
  # ==========================================
  
  # GC collection count
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionCount'
    name: kafka_gc_collection_count
    type: COUNTER
    labels:
      gc: "$1"
    help: "Total number of garbage collections"

  # GC collection time
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionTime'
    name: kafka_gc_collection_time_milliseconds
    type: COUNTER
    labels:
      gc: "$1"
    help: "Total time spent in garbage collection (milliseconds)"

  # ==========================================
  # KAFKA BROKER METRICS (Workload indicators)
  # ==========================================
  
  # Messages in per second
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><>Count'
    name: kafka_broker_messages_in_total
    type: COUNTER
    help: "Total messages received by broker"

  # Bytes in per second
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>Count'
    name: kafka_broker_bytes_in_total
    type: COUNTER
    help: "Total bytes received by broker"

  # Bytes out per second
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>Count'
    name: kafka_broker_bytes_out_total
    type: COUNTER
    help: "Total bytes sent by broker"

  # ==========================================
  # REQUEST METRICS (Processing load)
  # ==========================================
  
  # Request queue size
  - pattern: 'kafka.network<type=RequestMetrics, name=RequestQueueSize><>Value'
    name: kafka_request_queue_size
    type: GAUGE
    help: "Number of requests in the request queue"

  # Request handler pool idle percent
  - pattern: 'kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate'
    name: kafka_request_handler_idle_percent
    type: GAUGE
    help: "Average idle percentage of request handlers"

  # Produce request time (total)
  - pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=Produce><>Count'
    name: kafka_produce_request_total_time_ms_total
    type: COUNTER
    help: "Total time spent processing produce requests"

  # Fetch request time (total)
  - pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=Fetch><>Count'
    name: kafka_fetch_request_total_time_ms_total
    type: COUNTER
    help: "Total time spent processing fetch requests"

  # ==========================================
  # REPLICA MANAGER METRICS
  # ==========================================
  
  # Under replicated partitions
  - pattern: 'kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value'
    name: kafka_replica_manager_under_replicated_partitions
    type: GAUGE
    help: "Number of under-replicated partitions"

  # Leader count
  - pattern: 'kafka.server<type=ReplicaManager, name=LeaderCount><>Value'
    name: kafka_replica_manager_leader_count
    type: GAUGE
    help: "Number of leader replicas on this broker"

  # Partition count
  - pattern: 'kafka.server<type=ReplicaManager, name=PartitionCount><>Value'
    name: kafka_replica_manager_partition_count
    type: GAUGE
    help: "Number of partitions on this broker"

  # ISR shrinks
  - pattern: 'kafka.server<type=ReplicaManager, name=IsrShrinksPerSec><>Count'
    name: kafka_replica_manager_isr_shrinks_total
    type: COUNTER
    help: "Total ISR shrink operations"

  # ISR expands
  - pattern: 'kafka.server<type=ReplicaManager, name=IsrExpandsPerSec><>Count'
    name: kafka_replica_manager_isr_expands_total
    type: COUNTER
    help: "Total ISR expand operations"