lowercaseOutputName: true
lowercaseOutputLabelNames: true

# Expanded whitelist to include specific histogram attributes
whitelistObjectNames:
  - java.lang:type=OperatingSystem
  - java.lang:type=Threading
  - java.lang:type=Memory
  - java.lang:type=GarbageCollector,name=*
  - kafka.server:type=BrokerTopicMetrics,name=*
  - kafka.server:type=ReplicaManager,name=*
  - kafka.network:type=RequestMetrics,name=*
  - kafka.server:type=KafkaRequestHandlerPool,name=*
  - kafka.controller:type=KafkaController,name=*

rules:
  # ============================================================
  # LATENCY & PERCENTILES (The "Benchmark" Essentials)
  # ============================================================
  
  # Captures p50, p95, p99, p999 for Produce and Fetch requests
  - pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(Produce|Fetch)><>(50thPercentile|95thPercentile|99thPercentile|999thPercentile)'
    name: kafka_request_latency_ms
    labels:
      request_type: "$1"
      quantile: "$2"
    type: GAUGE
    # Note: quantile label will look like "99thPercentile". 
    # In Grafana, you can map these to 0.99 for standard quantile views.

  # Remote Time: Time spent waiting for ISR (key for benchmarking replication overhead)
  - pattern: 'kafka.network<type=RequestMetrics, name=RemoteTimeMs, request=Produce><>(95thPercentile|99thPercentile)'
    name: kafka_produce_remote_latency_ms
    labels:
      quantile: "$1"
    type: GAUGE

  # ============================================================
  # CPU & JVM (Research Focus)
  # ============================================================
  
  - pattern: 'java.lang<type=OperatingSystem><>(ProcessCpuLoad|SystemCpuLoad)'
    name: kafka_cpu_load_ratio
    labels:
      scope: "$1"
    type: GAUGE

  - pattern: 'java.lang<type=OperatingSystem><>SystemLoadAverage'
    name: kafka_system_load_average
    type: GAUGE

  - pattern: 'java.lang<type=Threading><>(ThreadCount|PeakThreadCount|DaemonThreadCount)'
    name: kafka_jvm_threads
    labels:
      statistic: "$1"
    type: GAUGE

  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>(CollectionCount|CollectionTime)'
    name: kafka_gc_$2_total
    labels:
      collector: "$1"
    type: COUNTER

  # ============================================================
  # THROUGHPUT & RESOURCE POOLS
  # ============================================================

  # Consolidated Throughput Metrics
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(MessagesInPerSec|BytesInPerSec|BytesOutPerSec)><>Count'
    name: kafka_broker_throughput_$1_total
    type: COUNTER

  # Request Handler Idle - If this drops to 0, your CPU is pinned or threads are blocked
  - pattern: 'kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>(OneMinuteRate|Value)'
    name: kafka_request_handler_idle_ratio
    type: GAUGE

  # Request Queue - Items waiting for a thread
  - pattern: 'kafka.network<type=RequestMetrics, name=RequestQueueSize><>Value'
    name: kafka_request_queue_size
    type: GAUGE

  # ============================================================
  # REPLICATION & HEALTH
  # ============================================================
  
  - pattern: 'kafka.server<type=ReplicaManager, name=(UnderReplicatedPartitions|LeaderCount|PartitionCount)><>Value'
    name: kafka_replica_manager_$1
    type: GAUGE

  - pattern: 'kafka.server<type=ReplicaManager, name=(IsrShrinksPerSec|IsrExpandsPerSec)><>Count'
    name: kafka_replica_manager_$1_total
    type: COUNTER