# Local Ubuntu Docker experiment Run 3: transactional producer with audit-enabled sink path.
#
# Use this as the benchmark.properties template for the audit overhead run.
# For the audit aggregator, copy the Kafka Streams section into streams.properties
# or export BOOTSTRAP_SERVERS, AUDIT_TOPIC, and TRANSACTION_TIMEOUT_MS at runtime.
# For the clean overhead run, copy the fault section into faults.properties or
# keep F1-F4 false through environment variables.
# Assumes the repo's Docker Compose Kafka and PostgreSQL services are running
# on local hardware and the Java app is launched from the Ubuntu host.

########### EXPERIMENT DESIGN METADATA ###########
experiment.name=local-run3-transactional-audit
experiment.description=Transactional producer path with audit-enabled consumer and Kafka Streams AuditAggregator.
experiment.producer.main=com.kafka.perf.baseline.BaselineProducer
experiment.consumer.main=com.kafka.perf.faults.FaultInjectorWithAuditConsumer
experiment.audit.aggregator.main=com.kafka.perf.audit.AuditAggregator
experiment.audit.enabled=true
experiment.faults.enabled=false
experiment.consumer.count=3
experiment.repetitions=3
experiment.stabilize.seconds=300
experiment.consumer.warmup.seconds=300
experiment.measured.window.seconds=1800
experiment.topic.partitions=12
experiment.topic.replication.factor=3
experiment.topic.min.insync.replicas=2
experiment.topic.retention.ms=7200000
experiment.audit.topic=audit-topic
experiment.audit.topic.partitions=3
experiment.audit.outcomes.topic=audit.outcomes
experiment.audit.outcomes.partitions=3
experiment.postgres.unique.kafka.offset.constraint=true
experiment.prometheus.url=http://localhost:9090

########### LOCAL DOCKER ENDPOINTS ###########
# Use localhost ports when the Java app runs on the Ubuntu host.
local.kafka.bootstrap.servers=localhost:9092,localhost:9093,localhost:9094
local.postgres.host=localhost
local.prometheus.url=http://localhost:9090

########### WORKLOAD ###########
# Same workload as Run 2 so the audit overhead is isolated.
producer.num.records=200000
producer.warmup.records=10000
producer.num.iterations=1000
producer.inter.test.delay.ms=1000
producer.message.size.bytes=1024
producer.target.throughput=0

########### TRANSACTION MODE ###########
transaction.enabled=true
txn.batch.size=1000
transactional.id=local-phase1-tx-producer

########### KAFKA PRODUCER ###########
bootstrap.servers=localhost:9092,localhost:9093,localhost:9094
topic=eos-topic
producer.topic=eos-topic
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
enable.idempotence=true
acks=all
retries=5
max.in.flight.requests.per.connection=5
linger.ms=100
batch.size=786432
compression=none
buffer.memory=134217728

########### KAFKA CONSUMER ###########
consumer.bootstrap.servers=localhost:9092,localhost:9093,localhost:9094
consumer.topic=eos-topic
consumer.group.id=local-run3-audit-sink-group
consumer.retries.max.attempts=5
consumer.retries.backoff.ms=100
consumer.retries.backoff.max.ms=10000
consumer.fetch.min.bytes=16384
consumer.fetch.max.wait.ms=50
consumer.max.partition.fetch.bytes=10485760
consumer.max.poll.records=3000
consumer.poll.timeout.ms=100
consumer.session.timeout.ms=30000
consumer.heartbeat.interval.ms=10000
consumer.max.poll.interval.ms=600000
consumer.isolation.level=read_committed
consumer.enable.auto.commit=false
consumer.auto.commit.interval.ms=5000
consumer.auto.offset.reset=earliest
consumer.log.interval.secs=10
consumer.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
consumer.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

########### POSTGRES SINK ###########
postgres.url=jdbc:postgresql://localhost:5432/eos_sink
postgres.user=eos
postgres.password=eos
postgres.sink.table=sink_events
postgres.connection.pool.size=10
postgres.write.batch.size=200

########### KAFKA STREAMS AUDIT AGGREGATOR ###########
application.id=local-audit-aggregator
audit.topic=audit-topic
transaction.timeout.ms=60000
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
commit.interval.ms=5000
replication.factor=3
processing.guarantee=at_least_once
num.standby.replicas=0
failure.threshold.extra.seconds=30
punctuation.interval.seconds=10

########### FAULT INJECTION COMPANION VALUES ###########
# Keep these false for the clean overhead comparison.
# Create separate F1-F4 profiles later for boundary-failure validation.
F1=false
F2=false
F3=false
F4=false
fault.inject.after.minutes=0
