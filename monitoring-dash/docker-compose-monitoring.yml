version: '3.8'

# Docker Compose for MONITORING MACHINE
# This file runs Prometheus and Grafana
# Connect to Kafka machine's exposed metric endpoints

services:
  # ============================================
  # KAFKA EXPORTER (Consumer group lag metrics)
  # ============================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka-1:29092'
      - '--kafka.server=kafka-2:29092'
      - '--kafka.server=kafka-3:29092'
    networks:
      - kafka-network

  # ============================================
  # AUDIT OUTCOMES EXPORTER
  # ============================================
  audit-outcomes-exporter:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: audit-outcomes-exporter
    restart: unless-stopped
    working_dir: /workspace/app
    environment:
      - BOOTSTRAP_SERVERS=kafka-1:29092
      - AUDIT_OUTCOMES_TOPIC=audit.outcomes
      - GROUP_ID=audit-outcomes-exporter
      - METRICS_PORT=8085
      - AUTO_OFFSET_RESET=earliest
    ports:
      - "8085:8085"
    volumes:
      - ../app:/workspace/app
      - audit-outcomes-m2:/root/.m2
    command: >
      sh -lc "mvn -q -DskipTests compile dependency:copy-dependencies -DincludeScope=runtime &&
      java -cp 'target/classes:target/dependency/*' com.kafka.perf.audit.AuditOutcomesExporter"
    networks:
      - kafka-network

  # ============================================
  # PROMETHEUS (Metrics collection & storage)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - kafka-network
    depends_on:
      - kafka-exporter
      - audit-outcomes-exporter

  # ============================================
  # GRAFANA (Visualization)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - kafka-network
    depends_on:
      - prometheus

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  audit-outcomes-m2:
    driver: local

networks:
  kafka-network:
    external: true
    name: kafka-cluster_kafka-network
