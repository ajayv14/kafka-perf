# Prometheus configuration for MONITORING MACHINE
# Place at: ./prometheus/prometheus.yml
# Replace <KAFKA_MACHINE_IP> with your actual Kafka machine IP address

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    cluster: 'kafka-research'
    environment: 'production'

rule_files:
  - '/etc/prometheus/recording-rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor - Container CPU metrics from Kafka machine
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Keep only CPU and memory metrics
      - source_labels: [__name__]
        regex: '(container_cpu_usage_seconds_total|container_memory_usage_bytes|container_spec_memory_limit_bytes)'
        action: keep

  # Node Exporter - Host system metrics from Kafka machine
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(node_cpu_.*|node_memory_.*|node_load.*|node_context_switches.*|node_intr.*)'
        action: keep

  # Kafka JMX Exporter - Broker 1
  - job_name: 'kafka-jmx-1'
    static_configs:
      - targets: ['kafka-1:7071']
        labels:
          broker_id: '1'
          instance: 'kafka-1'

  # Kafka JMX Exporter - Broker 2
  - job_name: 'kafka-jmx-2'
    static_configs:
      - targets: ['kafka-2:7071']
        labels:
          broker_id: '2'
          instance: 'kafka-2'

  # Kafka JMX Exporter - Broker 3
  - job_name: 'kafka-jmx-3'
    static_configs:
      - targets: ['kafka-3:7071']
        labels:
          broker_id: '3'
          instance: 'kafka-3'

  # Kafka exporter - consumer group lag metrics
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          app: 'kafka-exporter'

  # Audit outcomes exporter - business outcome metrics for Grafana
  - job_name: 'audit-outcomes-exporter'
    static_configs:
      - targets: ['audit-outcomes-exporter:8085']
        labels:
          app: 'audit-outcomes-exporter'
