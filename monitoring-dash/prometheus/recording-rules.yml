groups:
- name: kafka_throughput
  interval: 5s
  rules:

  - record: kafka_broker_bytes_in_kb_per_sec
    expr: sum by(instance) (rate(kafka_broker_bytes_in_total[5m])) / 1024

  - record: kafka_broker_bytes_out_kb_per_sec
    expr: sum by(instance) (rate(kafka_broker_bytes_out_total[5m])) / 1024

  - record: kafka_broker_throughput_kb_per_sec
    expr: sum by(instance) (rate(kafka_broker_bytes_in_total[5m]) + rate(kafka_broker_bytes_out_total[5m])) / 1024

  - record: kafka_cluster_bytes_in_kb_per_sec
    expr: sum(rate(kafka_broker_bytes_in_total[5m])) / 1024

  - record: kafka_cluster_bytes_out_kb_per_sec
    expr: sum(rate(kafka_broker_bytes_out_total[5m])) / 1024

  - record: kafka_cluster_throughput_bytes_per_sec
    expr: sum(rate(kafka_broker_bytes_in_total[5m]) + rate(kafka_broker_bytes_out_total[5m]))

  - record: kafka_cluster_messages_per_sec
    expr: sum(rate(kafka_broker_messages_in_total[5m]))

  - record: kafka_cluster_consumer_lag_messages
    expr: sum(kafka_consumergroup_lag)


- name: kafka_cpu
  interval: 5s
  rules:

  - record: kafka_broker_cpu_percent
    expr: |-
      sum by(broker) (
        label_replace(
          rate(container_cpu_usage_seconds_total{id=~"/docker/eb89133e6713d59534cad8060c0dc1a504aa615100a1b9890972f544ee45954a"}[5m]) * 100,
          "broker", "kafka-1", "id", ".*"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{id=~"/docker/b28a2bfc13fcebda950895c9b5d805fa79405c081cbcb374d0adee1bbfc3b4e4"}[5m]) * 100,
          "broker", "kafka-2", "id", ".*"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{id=~"/docker/11c2aba204cab1a5d0db3318092c490977a827b15436101e0edfd541875584ef"}[5m]) * 100,
          "broker", "kafka-3", "id", ".*"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service=~"kafka-[0-9]+"}[5m]) * 100,
          "broker", "$1", "container_label_com_docker_compose_service", "(kafka-[0-9]+)"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{name=~"kafka-[0-9]+"}[5m]) * 100,
          "broker", "$1", "name", "(kafka-[0-9]+)"
        )
      )

  - record: kafka_cluster_cpu_percent
    expr: sum(kafka_broker_cpu_percent)

  - record: kafka_cluster_cpu_cores
    expr: kafka_cluster_cpu_percent / 100

  - record: kafka_host_cpu_cores
    expr: count(count by(cpu) (node_cpu_seconds_total{mode="idle"}))

  - record: kafka_cluster_cpu_host_percent
    expr: kafka_cluster_cpu_percent / kafka_host_cpu_cores

  - record: kafka_cluster_jvm_cpu_percent
    expr: avg(jvm_process_cpu_load_ratio) * 100


- name: kafka_container_memory
  interval: 5s
  rules:

  - record: kafka_broker_container_memory_mb
    expr: |-
      sum by(broker) (
        label_replace(
          container_memory_usage_bytes{id=~"/docker/eb89133e6713d59534cad8060c0dc1a504aa615100a1b9890972f544ee45954a"},
          "broker", "kafka-1", "id", ".*"
        )
        or
        label_replace(
          container_memory_usage_bytes{id=~"/docker/b28a2bfc13fcebda950895c9b5d805fa79405c081cbcb374d0adee1bbfc3b4e4"},
          "broker", "kafka-2", "id", ".*"
        )
        or
        label_replace(
          container_memory_usage_bytes{id=~"/docker/11c2aba204cab1a5d0db3318092c490977a827b15436101e0edfd541875584ef"},
          "broker", "kafka-3", "id", ".*"
        )
        or
        label_replace(
          container_memory_usage_bytes{container_label_com_docker_compose_service=~"kafka-[0-9]+"},
          "broker", "$1", "container_label_com_docker_compose_service", "(kafka-[0-9]+)"
        )
        or
        label_replace(
          container_memory_usage_bytes{name=~"kafka-[0-9]+"},
          "broker", "$1", "name", "(kafka-[0-9]+)"
        )
      ) / 1048576

  - record: kafka_cluster_container_memory_gb
    expr: |-
      sum(
        container_memory_usage_bytes{id=~"/docker/(eb89133e6713d59534cad8060c0dc1a504aa615100a1b9890972f544ee45954a|b28a2bfc13fcebda950895c9b5d805fa79405c081cbcb374d0adee1bbfc3b4e4|11c2aba204cab1a5d0db3318092c490977a827b15436101e0edfd541875584ef)"}
        or
        container_memory_usage_bytes{container_label_com_docker_compose_service=~"kafka-[0-9]+"}
        or
        container_memory_usage_bytes{name=~"kafka-[0-9]+"}
      ) / 1073741824
