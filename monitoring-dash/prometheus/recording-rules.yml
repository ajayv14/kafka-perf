groups:
- name: kafka_throughput
  interval: 10s
  rules:

  - record: kafka_broker_bytes_in_kb_per_sec
    expr: sum by(instance) (rate(kafka_broker_bytes_in_total[5m])) / 1024

  - record: kafka_broker_bytes_out_kb_per_sec
    expr: sum by(instance) (rate(kafka_broker_bytes_out_total[5m])) / 1024

  - record: kafka_broker_throughput_kb_per_sec
    expr: sum by(instance) (rate(kafka_broker_bytes_in_total[5m]) + rate(kafka_broker_bytes_out_total[5m])) / 1024

  - record: kafka_cluster_bytes_in_kb_per_sec
    expr: sum(rate(kafka_broker_bytes_in_total[5m])) / 1024

  - record: kafka_cluster_bytes_out_kb_per_sec
    expr: sum(rate(kafka_broker_bytes_out_total[5m])) / 1024

  - record: kafka_cluster_throughput_bytes_per_sec
    expr: sum(rate(kafka_broker_bytes_in_total[5m]) + rate(kafka_broker_bytes_out_total[5m]))

  - record: kafka_cluster_messages_per_sec
    expr: sum(rate(kafka_broker_messages_in_total[5m]))

  - record: kafka_cluster_consumer_lag_messages
    expr: sum(kafka_consumergroup_lag)


- name: kafka_cpu
  interval: 10s
  rules:

  - record: kafka_broker_cpu_percent
    expr: |-
      sum by(broker) (
        label_replace(
          rate(container_cpu_usage_seconds_total{id=~"/docker/d4e09ee24f0462150137f58e44176a80d6d60063573563194c3992a7b19505cd"}[5m]) * 100,
          "broker", "kafka-1", "id", ".*"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{id=~"/docker/1e369223335ff1622b974d0ef1e27da8fceb4f5a9627752e568d49f05b39266e"}[5m]) * 100,
          "broker", "kafka-2", "id", ".*"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{id=~"/docker/62993338871c050dd5419828b3706e4543732bccbdbf45d68b2d5270f5f4177d"}[5m]) * 100,
          "broker", "kafka-3", "id", ".*"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service=~"kafka-[0-9]+"}[5m]) * 100,
          "broker", "$1", "container_label_com_docker_compose_service", "(kafka-[0-9]+)"
        )
        or
        label_replace(
          rate(container_cpu_usage_seconds_total{name=~"kafka-[0-9]+"}[5m]) * 100,
          "broker", "$1", "name", "(kafka-[0-9]+)"
        )
      )

  - record: kafka_cluster_cpu_percent
    expr: sum(kafka_broker_cpu_percent)

  - record: kafka_cluster_jvm_cpu_percent
    expr: avg(jvm_process_cpu_load_ratio) * 100


- name: kafka_container_memory
  interval: 10s
  rules:

  - record: kafka_broker_container_memory_mb
    expr: |-
      sum by(broker) (
        label_replace(
          container_memory_usage_bytes{id=~"/docker/d4e09ee24f0462150137f58e44176a80d6d60063573563194c3992a7b19505cd"},
          "broker", "kafka-1", "id", ".*"
        )
        or
        label_replace(
          container_memory_usage_bytes{id=~"/docker/1e369223335ff1622b974d0ef1e27da8fceb4f5a9627752e568d49f05b39266e"},
          "broker", "kafka-2", "id", ".*"
        )
        or
        label_replace(
          container_memory_usage_bytes{id=~"/docker/62993338871c050dd5419828b3706e4543732bccbdbf45d68b2d5270f5f4177d"},
          "broker", "kafka-3", "id", ".*"
        )
        or
        label_replace(
          container_memory_usage_bytes{container_label_com_docker_compose_service=~"kafka-[0-9]+"},
          "broker", "$1", "container_label_com_docker_compose_service", "(kafka-[0-9]+)"
        )
        or
        label_replace(
          container_memory_usage_bytes{name=~"kafka-[0-9]+"},
          "broker", "$1", "name", "(kafka-[0-9]+)"
        )
      ) / 1048576

  - record: kafka_cluster_container_memory_gb
    expr: |-
      sum(
        container_memory_usage_bytes{id=~"/docker/(d4e09ee24f0462150137f58e44176a80d6d60063573563194c3992a7b19505cd|1e369223335ff1622b974d0ef1e27da8fceb4f5a9627752e568d49f05b39266e|62993338871c050dd5419828b3706e4543732bccbdbf45d68b2d5270f5f4177d)"}
        or
        container_memory_usage_bytes{container_label_com_docker_compose_service=~"kafka-[0-9]+"}
        or
        container_memory_usage_bytes{name=~"kafka-[0-9]+"}
      ) / 1073741824
