# Kafka Streams Configuration for AuditAggregator
# These properties can be overridden via environment variables or command-line arguments

# Application ID - used for consumer group and state store prefix
application.id=audit-aggregator

# Kafka Bootstrap Servers
bootstrap.servers=localhost:9092

# Source topic containing audit events
audit.topic=audit-topic

# Transaction timeout in milliseconds - threshold for marking batches as failed
transaction.timeout.ms=60000

# Streams-specific configuration
# Default key/value serialization (String)
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

# Commit interval (how often to commit offsets)
commit.interval.ms=5000

# Replication factor for state store changelog topics
replication.factor=1

# Processing guarantee: at_least_once or exactly_once
processing.guarantee=at_least_once

# Number of standby replicas for high availability (0 = no standby)
num.standby.replicas=0

# Failure threshold: additional seconds beyond transaction.timeout.ms to wait before marking as failed
failure.threshold.extra.seconds=30

# Punctuation interval in seconds: how often to check for expired entries
punctuation.interval.seconds=10
