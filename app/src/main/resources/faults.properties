########### FAULT INJECTION CONFIGURATION ###########
# Probabilities for various fault scenarios (0.0 = disabled, 1.0 = always enabled)
# These faults simulate edge cases and failure modes in the Kafka-to-PostgreSQL pipeline

# F1: Consumer crash before database commit
# Simulates process termination before INSERT is committed
# Impact: Message lost, offset not advanced
fault.f1.crash.before.db.commit=0.0

# F2: Consumer crash after database commit but before Kafka offset acknowledged
# Simulates process crash after data persisted but before offset commit
# Impact: Message duplicated on recovery (at-least-once semantics)
fault.f2.crash.after.db.commit.before.ack=0.0

# F3: Partial batch writes to database
# Simulates partial failure where only some records in a batch are written
# Impact: Data inconsistency, gaps in sequence
fault.f3.partial.batch.writes=0.0

# F4: Database container restart/crash
# Simulates PostgreSQL container restart or unplanned downtime
# Impact: Connection failures, temporary unavailability
fault.f4.db.container.restart=0.0

# F5: Slow sink backpressure
# Simulates slow database performance causing consumer to lag
# Impact: Consumer lag increases, potential rebalancing
fault.f5.slow.sink.backpressure=0.0

# F6: Network boundary fault between consumer and database
# Simulates network issues (packet loss, latency) between consumer and PostgreSQL
# Impact: Connection timeouts, temporary unavailability
fault.f6.network.boundary.fault=0.0

########### FAULT SCHEDULING CONFIGURATION ###########
# SEQUENTIAL FAULT INJECTION: Inject one fault at a time in order F1 -> F2 -> ... -> F6 -> repeat
# with configurable breaks (periods without any faults) between fault injections.
#
# This mode injects faults sequentially, one after another with optional breaks:
# - F1 for N messages, then
# - BREAK for M messages (no faults), then
# - F2 for N messages, then
# - BREAK for M messages (no faults), then
# - ... continue through F6 ...
# - Then repeat the cycle
#
# Configuration:
# fault.schedule.sequential.enabled=true|false     Enable sequential scheduling
# fault.schedule.duration.messages=<number>        How long (in messages) each fault runs
# fault.schedule.break.messages=<number>           How long (in messages) breaks last between faults (0 = no breaks)
# fault.schedule.iterations=<number>               How many times to cycle through F1-F6
#
# Example 1: 3 full cycles with 10k messages per fault, NO breaks
# fault.schedule.sequential.enabled=true
# fault.schedule.duration.messages=10000
# fault.schedule.break.messages=0
# fault.schedule.iterations=3
# 
# Produces:
# Cycle 1: msgs 0-10k(F1), 10k-20k(F2), 20k-30k(F3), 30k-40k(F4), 40k-50k(F5), 50k-60k(F6)
# Cycle 2: msgs 60k-70k(F1), 70k-80k(F2), ...
# Cycle 3: msgs 120k-130k(F1), 130k-140k(F2), ...
#
# Example 2: 2 full cycles with 10k messages per fault, 5k message breaks between faults
# fault.schedule.sequential.enabled=true
# fault.schedule.duration.messages=10000
# fault.schedule.break.messages=5000
# fault.schedule.iterations=2
#
# Produces (each cycle = 90k messages: 6*(10k fault + 5k break)):
# Cycle 1: msgs 0-10k(F1), 10k-15k(BREAK), 15k-25k(F2), 25k-30k(BREAK), ...
# Cycle 2: msgs 90k-100k(F1), 100k-105k(BREAK), ...


fault.schedule.sequential.enabled=false
fault.schedule.duration.messages=10000
fault.schedule.break.messages=10000
fault.schedule.iterations=2

########### TIME-BASED ONE-SHOT SCHEDULING (MINUTES) ###########
# Preferred simple mode: trigger each fault once at a fixed minute interval.
# Order defaults to F1,F2,F3,F4,F5,F6. Scheduler fires each fault exactly once.
#
# Example:
# fault.schedule.time.enabled=true
# fault.schedule.time.start.delay.minutes=1
# fault.schedule.time.gap.minutes=2
# fault.schedule.time.order=F1,F2,F3,F4,F5,F6
#
# Timeline above means:
#  +1 min  -> F1 once
#  +3 min  -> F2 once
#  +5 min  -> F3 once
#  ...

fault.schedule.time.enabled=true
fault.schedule.time.start.delay.minutes=0
fault.schedule.time.gap.minutes=1
fault.schedule.time.order=F1,F2,F3,F4,F5,F6
