########### MODE ###########
# IDEMPOTENT : transaction.enabled=false | TXN_SMALL = 500| TXN_LARGE = 1000

########### WORKLOAD ###########
producer.num.records=200000
producer.warmup.records=10000
producer.num.iterations=500
producer.inter.test.delay.ms=1000

########### TRANSACTION ###########
transaction.enabled=false
txn.batch.size=1000

########### KAFKA ###########
bootstrap.servers=localhost:9092,localhost:9093,localhost:9094
topic=eos-topic
producer.topic=eos-topic

########### KAFKA PRODUCER SERIALIZERS ###########
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer

########### EOS ESSENTIALS ###########
enable.idempotence=true
acks=all
retries=2147483647
max.in.flight.requests.per.connection=5

########### TRANSACTION ###########
transactional.id=phase1-tx-producer

########### PERFORMANCE ###########
linger.ms=100
batch.size=786432
#compression=lz4
compression=none

buffer.memory=134217728

# Message size sent by producer (bytes). Set to 1024 for 1KB payloads.
producer.message.size.bytes=1024

# Target throughput in messages per second (0 = unlimited, sends as fast as possible)
producer.target.throughput=50000

# How often (in records) the producer will call flush() during a run.
# A larger value reduces flush overhead but increases in-flight buffered data.
#producer.flush.interval.records=25000

########### SCALABLE CONSUMER CONFIGURATION ###########
# Consumer broker connection
consumer.bootstrap.servers=localhost:9092,localhost:9093,localhost:9094
consumer.topic=eos-topic
consumer.group.id=scalable-consumer-group

# Consumer retries and reliability
consumer.retries.max.attempts=5
consumer.retries.backoff.ms=100
consumer.retries.backoff.max.ms=10000

########### CONSUMER FETCH OPTIMIZATION ###########
# Lowered fetch.min.bytes so consumers don't wait for large batches
# with 1KB messages; reduces fetch latency and helps steady throughput.
consumer.fetch.min.bytes=16384
# Reduce fetch wait to surface available data faster
consumer.fetch.max.wait.ms=50
# Limit per-partition fetch size to reasonable value (10MB)
consumer.max.partition.fetch.bytes=10485760

########### CONSUMER POLLING ###########
# Reduce max.poll.records to avoid very large single processing batches
# which can cause bursts of CPU and delay heartbeats/rebalances.
consumer.max.poll.records=3000
# Increase poll timeout slightly to avoid busy-looping polls
consumer.poll.timeout.ms=100

########### CONSUMER SESSIONS ###########
consumer.session.timeout.ms=30000
consumer.heartbeat.interval.ms=10000
consumer.max.poll.interval.ms=600000

# Isolation level: read_committed or read_uncommitted
consumer.isolation.level=read_uncommitted

# Auto commit settings
consumer.enable.auto.commit=false
consumer.auto.commit.interval.ms=5000
consumer.auto.offset.reset=earliest

# Logging
consumer.log.interval.secs=10

# Deserializers
consumer.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
consumer.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

########### POSTGRES SINK CONFIGURATION ###########
# PostgreSQL JDBC connection
# For LOCAL DEVELOPMENT (running Java app on host, PostgreSQL in Docker):
#   postgres.url=jdbc:postgresql://localhost:5432/eos_sink
# For DOCKER DEPLOYMENT (running Java app in Docker on kafka-network):
#   postgres.url=jdbc:postgresql://pg-sink:5432/eos_sink
# Override with environment variable: POSTGRES_URL
postgres.url=jdbc:postgresql://localhost:5432/eos_sink
postgres.user=eos
postgres.password=eos
postgres.sink.table=sink_events

# Connection pool settings
postgres.connection.pool.size=10
postgres.write.batch.size=100
