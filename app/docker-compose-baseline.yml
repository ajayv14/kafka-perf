version: "3.9"

# Docker Compose for Baseline Kafka Consumer
# Deploy multiple consumer instances with horizontal scaling
# 
# Features:
# - Simple consumer without retry logic
# - Horizontal scaling to 3 instances
# - Consumer group coordination for automatic partition assignment
# - Environment-based configuration
# 
# Usage:
#   # Start with 3 consumer instances (default)
#   docker-compose -f docker-compose-baseline.yml up -d
#   
#   # Scale to different number
#   docker-compose -f docker-compose-baseline.yml up -d --scale consumer=5
#   
#   # View logs for all consumers
#   docker-compose -f docker-compose-baseline.yml logs -f consumer
#   
#   # Stop all consumers
#   docker-compose -f docker-compose-baseline.yml down

services:
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.baseline
    image: kafka-perf-baseline:latest
    container_name: kafka-baseline-consumer-${COMPOSE_SERVICE_NUMBER:-1}
    hostname: kafka-baseline-consumer-${COMPOSE_SERVICE_NUMBER:-1}
    
    # Environment variables for consumer configuration
    environment:
      # Kafka cluster bootstrap servers
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-1:29092,kafka-2:29092,kafka-3:29092}
      
      # Topic to consume from
      TOPIC: ${TOPIC:-test-topic}
      
      # Consumer group - shared across all instances for load balancing
      GROUP_ID: ${GROUP_ID:-baseline-consumer-group}
      
      # Isolation level: read_committed or read_uncommitted
      ISOLATION_LEVEL: ${ISOLATION_LEVEL:-read_committed}
      
      # Java heap settings
      JAVA_HEAP_OPTS: ${JAVA_HEAP_OPTS:--Xms512m -Xmx512m}
      
      # Main class to run
      MAIN_CLASS: com.kafka.perf.baseline.BaselineConsumer
      
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=20
        -XX:InitiatingHeapOccupancyPercent=35
        -XX:G1HeapRegionSize=16M
        -XX:MetaspaceSize=96m

    # Resource constraints (per container)
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512m

    # Connect to Kafka network
    networks:
      - kafka-network

    # Restart policy
    restart: unless-stopped

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kafka-network:
    driver: bridge
    external: true  # Connect to existing Kafka cluster network
